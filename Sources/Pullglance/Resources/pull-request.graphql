query($owner: String!, $name: String!, $number: Int!, $withMerge: Boolean!) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) { ...PullRequestFields }
  }
}

fragment PullRequestFields on PullRequest {
  state
  number title url isDraft updatedAt baseRefName headRefName headRefOid
  mergeable @include(if: $withMerge)
  mergeStateStatus @include(if: $withMerge)
  id @include(if: $withMerge)
  isMergeQueueEnabled @include(if: $withMerge)
  mergeQueueEntry @include(if: $withMerge) { position }
  mergeQueue @include(if: $withMerge) { configuration { mergeMethod } }
  viewerCanEnableAutoMerge @include(if: $withMerge)
  autoMergeRequest @include(if: $withMerge) { mergeMethod }
  repository {
    nameWithOwner
    mergeCommitAllowed squashMergeAllowed rebaseMergeAllowed deleteBranchOnMerge viewerDefaultMergeMethod
  }
  author { login avatarUrl }
  reviewDecision
  reviewThreads(first: 50) { nodes { isResolved } }
  reviewRequests(first: 10) { nodes { requestedReviewer { __typename ... on Team { slug } } } }
  commits(last: 1) { nodes { commit { statusCheckRollup { state } } } }
}
