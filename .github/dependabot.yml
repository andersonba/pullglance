version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /Web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web-dev:
        dependency-type: development
        update-types: [minor, patch]
